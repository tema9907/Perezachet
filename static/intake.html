<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приём заявлений</title>
  <link rel="stylesheet" href="/static/style.css">
  <link id="favicon" rel="icon" type="image/x-icon" href="/static/favicon.ico">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" style="font-size:13px;">ЗАЯ</span>
      <div>
        <h1>Приём заявлений</h1>
        <p>Оформление заявлений студентов на перезачёт дисциплин по сертификатам</p>
      </div>
    </div>
    <div class="actions actions-right" style="gap:10px;">
      <a class="btn-ghost" href="/">← Экспертное заключение</a>
      <a class="btn-ghost" href="/approve">Апрув заявлений</a>
    </div>
  </header>

  <main>
    <!-- Данные студента -->
    <section class="card">
      <div class="step-head">
        <span class="step-num">1</span>
        <h2>Данные студента</h2>
      </div>

      <div class="grid-2">
        <div class="field" style="grid-column:1/-1;">
          <label>ФИО студента *</label>
          <input id="fName" type="text" placeholder="Иванов Иван Иванович" autocomplete="off">
        </div>

        <div class="field">
          <label>Курс</label>
          <div class="combobox" id="cb-course">
            <input class="cb-input" type="text" placeholder="1 — 4" autocomplete="off">
            <div class="cb-dropdown hidden"></div>
          </div>
        </div>

        <div class="field">
          <label>Телефон</label>
          <input id="fPhone" type="text" placeholder="+7 (700) 000-00-00" autocomplete="off">
        </div>

        <div class="field">
          <label>Факультет</label>
          <div class="combobox" id="cb-faculty">
            <input class="cb-input" type="text" placeholder="Введите или выберите..." autocomplete="off">
            <div class="cb-dropdown hidden"></div>
          </div>
        </div>

        <div class="field">
          <label>Кафедра</label>
          <div class="combobox" id="cb-department">
            <input class="cb-input" type="text" placeholder="Введите или выберите..." autocomplete="off">
            <div class="cb-dropdown hidden"></div>
          </div>
        </div>

        <div class="field">
          <label>Группа</label>
          <div class="combobox" id="cb-group">
            <input class="cb-input" type="text" placeholder="Введите или выберите..." autocomplete="off">
            <div class="cb-dropdown hidden"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Предметы -->
    <section class="card">
      <div class="step-head">
        <span class="step-num">2</span>
        <h2>Предметы для перезачёта</h2>
      </div>
      <p class="hint">Добавьте дисциплины и прикрепите PDF-сертификат к каждой.</p>

      <div id="subjectList"></div>

      <button id="addSubjectBtn" class="btn-ghost" style="margin-top:14px;">+ Добавить предмет</button>
    </section>

    <!-- Действия -->
    <section class="card">
      <div class="actions actions-right">
        <button id="generateBtn" class="btn-primary">Сформировать документы</button>
      </div>

      <div id="resultBlock" class="hidden" style="margin-top:16px;padding:14px 18px;
           background:var(--primary-soft);border-radius:10px;line-height:1.7;">
        <p id="resultText" style="margin:0 0 4px;font-weight:500;color:var(--text);"></p>
        <a id="driveLink" href="#" target="_blank" rel="noopener noreferrer"
           style="color:var(--primary);font-size:13px;text-decoration:none;" class="hidden">
          Открыть объединённый PDF на Google Drive →
        </a>
        <p id="driveErrorText" style="color:var(--danger);font-size:12px;margin:4px 0 0;"
           class="hidden"></p>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script src="/static/intake.js"></script>
</body>
</html>
