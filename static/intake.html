<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приём заявлений</title>
  <link rel="stylesheet" href="/static/style.css">
  <link id="favicon" rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <script src="/static/theme.js"></script>
  <style>
    /* Кафедра-держатель предмета */
    .subject-fac-dept-block {
      background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 8px; padding: 10px 12px;
    }
    .fac-dept-header {
      font-size: 11px; font-weight: 700; color: #475569;
      text-transform: uppercase; letter-spacing: .05em;
      display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    }
    .fac-dept-required-badge {
      background: #fef9c3; color: #854d0e; border-radius: 4px;
      padding: 1px 6px; font-size: 10px; font-weight: 600;
      text-transform: none; letter-spacing: 0;
    }
    .fac-dept-tip {
      color: #94a3b8; font-size: 10px; font-weight: 400;
      text-transform: none; letter-spacing: 0; cursor: default;
    }
    .fac-dept-selects { display: flex; gap: 8px; flex-wrap: wrap; }
    .fac-dept-selects .combobox { flex: 1; min-width: 150px; }
    .fac-dept-selected {
      display: none; align-items: center; gap: 6px;
      margin-top: 8px; padding: 5px 10px;
      background: #eff6ff; border-radius: 6px;
      font-size: 12px; color: #1d4ed8; font-weight: 500;
    }
    .fac-dept-selected.visible { display: flex; }
    .fac-dept-selected-arrow { color: #93c5fd; }
    .subj-required-hint {
      display: none; font-size: 11px; color: #d97706; margin-top: 6px;
    }
    .subj-required-hint.visible { display: block; }

    [data-theme="dark"] .subject-fac-dept-block { background: #1e2132; border-color: #262a3a; }
    [data-theme="dark"] .fac-dept-header { color: #94a3b8; }
    [data-theme="dark"] .fac-dept-required-badge { background: #3d2f00; color: #fde68a; }
    [data-theme="dark"] .fac-dept-selected { background: #1e3a8a; color: #93c5fd; }
    [data-theme="dark"] .fac-dept-selected-arrow { color: #60a5fa; }
    [data-theme="dark"] .subj-required-hint { color: #fbbf24; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="logo">ЭЗ</span>
      <span class="brand-name">NefrLearn</span>
    </a>
    <nav class="main-nav">
      <a href="/" class="nav-link">Генератор</a>
      <a href="/formal" class="nav-link">Формальный перезачёт</a>
      <a href="/intake" class="nav-link active">Приём заявлений</a>
      <a href="/applications" class="nav-link">Заявления</a>
      <a href="/approve" class="nav-link">Экспертная очередь</a>
      <a href="/conclusions" class="nav-link">Заключения</a>
    </nav>
    <div class="topbar-end">
      <button id="themeToggle" class="nav-theme-toggle" onclick="__toggleTheme()" title="Тёмная тема">🌙</button>
      <a href="/admin" class="nav-admin" title="Adminка">⚙</a>
    </div>
  </header>

  <main>
    <!-- Данные студента -->
    <section class="card">
      <div class="step-head">
        <span class="step-num">1</span>
        <h2>Данные студента</h2>
      </div>

      <div class="grid-2">
        <div class="field" style="grid-column:1/-1;">
          <label>ФИО студента *</label>
          <input id="fName" type="text" placeholder="Иванов Иван Иванович" autocomplete="off">
        </div>

        <div class="field">
          <label>Курс</label>
          <div class="combobox" id="cb-course">
            <input class="cb-input" type="text" placeholder="1 — 4" autocomplete="off">
            <div class="cb-dropdown hidden"></div>
          </div>
        </div>

        <div class="field">
          <label>Телефон</label>
          <input id="fPhone" type="text" placeholder="+7 (700) 000-00-00" autocomplete="off">
        </div>

        <div class="field">
          <label>Факультет</label>
          <div class="combobox" id="cb-faculty">
            <input class="cb-input" type="text" placeholder="Введите или выберите..." autocomplete="off">
            <div class="cb-dropdown hidden"></div>
          </div>
        </div>

        <div class="field">
          <label>Кафедра</label>
          <div class="combobox" id="cb-department">
            <input class="cb-input" type="text" placeholder="Введите или выберите..." autocomplete="off">
            <div class="cb-dropdown hidden"></div>
          </div>
        </div>

        <div class="field">
          <label>Группа</label>
          <div class="combobox" id="cb-group">
            <input class="cb-input" type="text" placeholder="Введите или выберите..." autocomplete="off">
            <div class="cb-dropdown hidden"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Предметы -->
    <section class="card">
      <div class="step-head">
        <span class="step-num">2</span>
        <h2>Предметы для перезачёта</h2>
      </div>
      <p class="hint">Добавьте дисциплины и прикрепите PDF-сертификат к каждой.</p>

      <div id="subjectList"></div>

      <button id="addSubjectBtn" class="btn-ghost" style="margin-top:14px;">+ Добавить предмет</button>
    </section>

    <!-- Действия -->
    <section class="card">
      <div class="actions actions-right">
        <button id="generateBtn" class="btn-primary">Сформировать документы</button>
      </div>

      <div id="resultBlock" class="hidden" style="margin-top:16px;padding:14px 18px;
           background:var(--primary-soft);border-radius:10px;line-height:1.7;">
        <p id="resultText" style="margin:0 0 4px;font-weight:500;color:var(--text);"></p>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script src="/static/intake.js"></script>
</body>
</html>
